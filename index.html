<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-title" content="Claude Bot">
  <title>Claude Bot</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="errorBar" class="error-bar hidden"></div>
  <div id="app"></div>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="agents">
      <svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2.4"/><circle cx="17" cy="8" r="2.4"/><circle cx="12" cy="16" r="2.4"/></svg>
      <span>Agents</span>
    </button>
    <button data-tab="activity">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h10M5 18h12"/></svg>
      <span>Activity</span>
    </button>
    <button data-tab="account">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.2"/><path d="M5 19c1.4-3 4-4.5 7-4.5S17.6 16 19 19"/></svg>
      <span>Account</span>
    </button>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
